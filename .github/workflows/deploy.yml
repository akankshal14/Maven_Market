name: CI/CD Pipeline Deployment

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  lint-and-test:
    name: Code Linting & PyTest Execution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest flake8 pyyaml databricks-sdk databricks-connect

      - name: Code Linting (flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --builtins=spark,dbutils,display --show-source --statistics
          # Treat formatting warnings gracefully
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --builtins=spark,dbutils,display --statistics

      - name: Execute PyTest Suite
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_SERVERLESS_COMPUTE_ID: auto
        run: |
          pytest tests/ --verbose

  deploy-dabs:
    name: Deploy Databricks Asset Bundle (DABs)
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate, Deploy & Run Bundle on Dev
        if: github.ref == 'refs/heads/dev'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate -t dev
          databricks bundle deploy -t dev
          databricks bundle run maven_market_bundle_etl -t dev

      - name: Validate, Deploy & Run Bundle on Production
        if: github.ref == 'refs/heads/main'
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate -t prod
          databricks bundle deploy -t prod
          databricks bundle run maven_market_bundle_etl -t prod
